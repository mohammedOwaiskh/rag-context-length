# rag-context-length — frozen experiment configuration

dataset:
  name: squad
  version: "1.1"
  hf_split: train

sampling:
  n_questions: 1500
  seed: 42

corpus:
  paths:
    passages: data/corpus/passages.parquet
    faiss_index: data/corpus/faiss_index.bin
  questions_path: data/questions/sampled_1500.parquet

retrieval:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_batch_size: 64
  top_k_retrieved: 20
  k_values: [1, 3, 5, 10, 20]

generation:
  backend: hf_bnb   # hf_bnb (GPU, Colab T4) | llama_cpp_gguf (CPU-only)
  batch_size: 2 # For k = 20 # 4 # For k = 10       # 8     # lower this for k=10/20 if you hit a CUDA OOM on T4 —
                     # longer contexts per item mean more memory per batch slot
  model:
    hf_bnb: Qwen/Qwen2.5-3B-Instruct
    llama_cpp_gguf: Qwen/Qwen2.5-3B-Instruct-GGUF   # Q4_K_M quant
    cpu_fallback: Qwen/Qwen2.5-1.5B-Instruct
  generation_config:
    do_sample: false
    temperature: 0
    max_new_tokens: 20          # short spans only, per pilot finding (was null/64 -> EM~0)
    repetition_penalty: null   # TBD — fix during pilot

evaluation:
  bootstrap:
    n_boot: 2000
    seed: 42

pilot:
  n_questions: 75

paths:
  results_dir: results/
  pilot_results_dir: results/pilot/
  main_results_dir: results/main/
  poster_plots_dir: results/main/plots/

reproducibility:
  library_versions: null   # TBD — fill after environment setup
  hardware: Colab T4