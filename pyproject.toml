[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-context-length"
version = "0.1.0"
description = "How Much Context Is Enough? Investigating the Impact of Retrieval Context Length on RAG-Based Question Answering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Mohammed Owais Khan" },
    { name = "Zaina Naaz Mohd Kalim Ansari" },
]

dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
    "datasets",
    "sentence-transformers",
    "faiss-cpu",
    "transformers",
    "accelerate",
    "bitsandbytes",
    "torch",
    "evaluate",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
cpu = [
    "llama-cpp-python",
]
notebook = [
    "jupyter",
    "ipykernel",
]

[project.urls]
Repository = "https://github.com/mohammedOwaiskh/rag-context-length"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["retrieval*", "generation*", "evaluation*", "experiments*"]